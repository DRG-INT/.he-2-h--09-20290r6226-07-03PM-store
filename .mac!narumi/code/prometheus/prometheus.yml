global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus önmaga
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # Node Exporter - rendszer metrikák
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
  
  # cAdvisor - container metrikák
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  
  # Kernel-LSTM Agent metrikák
  - job_name: 'kernel-lstm-agent'
    static_configs:
      - targets: ['agent:8080']
    metrics_path: '/metrics'
  
  # InfluxDB
  - job_name: 'influxdb'
    static_configs:
      - targets: ['influxdb:8086']
    metrics_path: '/metrics'
