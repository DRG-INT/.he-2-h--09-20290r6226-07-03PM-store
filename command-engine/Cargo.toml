[package]
name = "command-engine"
version = "0.1.0"
edition = "2021"
authors = ["UNICAGD-Core"]
description = "Hybrid PHP-Rust Command Engine for Kernelpanic Data Model"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
chrono = "0.4"
