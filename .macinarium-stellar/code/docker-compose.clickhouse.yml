version: '3.8'

services:
  # eBPF Agent - kernel események gyűjtése
  agent:
    build: ./agent
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/proc:ro
      - /lib/modules:/lib/modules:ro
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=kernel_events
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - kernel-lstm

  # Előfeldolgozó - szekvenciák építése
  processor:
    build: ./processor
    volumes:
      - ./data:/data
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=kernel_events
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - kernel-lstm

  # LSTM Modell - tanítás és predikció
  model:
    build: ./model
    volumes:
      - ./models:/models
      - ./data:/data
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=kernel_events
      - DEVICE=cuda
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - kernel-lstm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ClickHouse - idő sorozat adatbázis
  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml
    environment:
      - CLICKHOUSE_DB=kernel_events
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    restart: unless-stopped
    networks:
      - kernel-lstm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - dashboard
  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - kernel-lstm

  # Prometheus - metrikák gyűjtése
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - kernel-lstm

  # Node Exporter - rendszer metrikák
  node-exporter:
    image: prom/node-exporter:v1.6.0
    ports:
      - "9100:9100"
    pid: host
    restart: unless-stopped
    networks:
      - kernel-lstm

volumes:
  clickhouse_data:
  grafana_data:
  prometheus_data:

networks:
  kernel-lstm:
    driver: bridge
